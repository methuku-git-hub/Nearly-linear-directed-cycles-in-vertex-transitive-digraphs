name: Import certified source snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and expand the prepared publication package
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          import zipfile
          archive = Path('theorem-1-5-repository-payload.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'aaf6bf3fd03991a1eb6a3bbdd6c9ef9a47642266ba27d1f1c723e337a1204d49'
          assert not Path('directed-cycles-lean').exists(), 'Snapshot already imported'
          allowed = {'README.md', '.gitignore', '.gitattributes', 'scripts', 'release', 'directed-cycles-lean'}
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist()) == len(set(z.namelist()))
              for name in z.namelist():
                  p = PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
                  assert p.parts[0] in allowed
              z.extractall('.')
          PY
          python3 scripts/check_snapshot.py
      - name: Commit the expanded, hash-checked sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md .gitignore .gitattributes scripts release directed-cycles-lean
          git rm -- theorem-1-5-repository-payload.zip
          git commit -m 'Publish byte-identical certified Theorem 1.5 source and verification evidence'
          git push origin HEAD:main
