  - title: "A nearly linear bound for the Lovász conjecture"
    authors: ["Bowen Li", "Abhishek Methuku"]
    type: "paper"
    relationship: "background"
    id: "arXiv:2609.38135"
    location: "https://arxiv.org/abs/2609.38135"
    note: "Undirected work identified by the revised manuscript as the basis of its directed adaptation."
  - title: "The structure of approximate groups"
    authors: ["Emmanuel Breuillard", "Ben Green", "Terence Tao"]
    type: "paper"
    relationship: "adapts"
    id: "arXiv:1110.5008v2; doi:10.1007/s10240-012-0043-9"
    location: "https://arxiv.org/abs/1110.5008v2"
    note: >-
      This is the BGT source named throughout the structural development and
      blueprint. The formalization proves the finite coset-nilprogression
      consequence used by the graph argument through approximate-group models,
      escape estimates, and local Lie dimension induction. The blueprint records
      replacements and restrictions, including the absence of a claim to the
      general local-group globalization theorem or every BGT normal-form statement.
  - title: "Freiman's theorem in an arbitrary nilpotent group"
    authors: ["Matthew C. H. Tointon"]
    type: "paper"
    relationship: "adapts"
    id: "arXiv:1211.3989v3; Proc. London Math. Soc. 109 (2014), 318–352"
    location: "https://arxiv.org/abs/1211.3989v3"
    note: >-
      The finite multilinear-image and normal-envelope arguments are identified
      in the Lean source as adaptations of Propositions 6.1 and 7.3. The
      development uses finite Sylow decomposition and relative-height induction.
      It does not claim the full general Proposition 7.2, whose unused route is
      retained in blueprint/replaced-general-multihom-envelope.json as history.

