  - title: "A finitary structure theorem for vertex-transitive graphs of polynomial growth"
    authors: ["Romain Tessera", "Matthew C. H. Tointon"]
    type: "paper"
    relationship: "adapts"
    id: "Combinatorica 41 (2021), 263–298; doi:10.1007/s00493-020-4295-6"
    location: "https://arxiv.org/abs/1908.06044v3"
    note: >-
      The manuscript cites Corollary 2.4. The formalization proves the finite
