status:
  scope: >-
    Theorem 1.5 and the actual dependencies of its Lean proof. Solution.lean
    proves the independently stated wrapper DirectedCycles.nearly_linear_directed_cycles
    from DirectedCycles.theorem_1_5, exposing graph hypotheses and the cycle
    witness using relations, permutations, and an injective finite sequence.
    Theorem 1.3, Section 8, the full layer-bound assertion of Lemma 6.2, and the
    unused explicit quotient-chain assertion of Lemma 6.3 are not claimed.
    Historical verification evidence is for the earlier Lean 4.34 release;
    verification of this Lean 4.35 adaptation is tracked separately.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: []
      framework: "OpenAI Codex"
      tool_setup: >-
        Codex generated and revised Lean proofs and verification scripts,
        invoked Lean and Mathlib tactics, inspected compiler output, and
        repaired failures under the maintainer's direction. Individual model
        assignments across the entire development were not fully recorded.
      prompting_notes: >-
        Formalize the exact manuscript theorem and dependency closure;
        repair mathematical gaps without adding unproved assumptions;
        distinguish proved results, conditional reductions, and unused source
        claims; issue verification evidence only after its checks pass.
  notes: >-
    Mathematical authorship of the source paper is Bowen Li and Abhishek
    Methuku. Abhishek Methuku directed and maintains the formalization.
    Codex produced the formal development and verification tooling. The
    deliberate statement-only sorry in Challenge.lean is excluded from
    the proof-status counts, as required by the metadata standard.

fidelity:
  divergences: >-
    The main result retains the manuscript's loopless finite-digraph
    conventions, underlying-undirected connectedness, vertex transitivity,
    real exponent, and quantifier order. The proof includes repaired
    return-walk intersection arguments, tensor interpolation with torsion,
    finite prime-field character counting, and a finite structural argument
    using local-group and local Lie dimension induction. It does not claim
    every stronger formulation of literature results or the unused source
    assertions documented in blueprint/source-statements-not-used.json.
    Detailed repairs and scope are recorded in the project README and blueprint.

